# Metadatos de la plantilla para el catálogo de NoExpertise.
id: negocio-local
nombre: Negocio local
descripcion: Web cálida para tiendas, bares y talleres, con horario, fotos y botón de llamar.
sectores: [tienda, restaurante, taller]
secciones:
  - { id: hero, nombre: Portada }
  - { id: servicios, nombre: Servicios }
  - { id: galeria, nombre: Galería de fotos }
  - { id: horario-ubicacion, nombre: Horario y ubicación }
  - { id: testimonios, nombre: Opiniones de clientes }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: contacto, nombre: Contacto }
estilo: calido
plan_minimo: gratis
version: 1.4.0
base: astrowind
demo_url: https://demo-plantilla-negocio-local.noexpertise.com
activa: true
orden: 20

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu negocio"
    pregunta: "¿Cómo se llama tu negocio y qué hacéis?"
    ayuda: "Qué vendes u ofreces, para quién y en qué calle o barrio."
    tipo: texto
    campos: [nombre, eslogan, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, secciones.hero.items, seo.descripcion]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.instagram, redes.facebook]
  - id: servicios
    titulo: "Lo que ofreces"
    pregunta: "¿Qué ofreces? Uno por línea, como se lo dirías a un cliente."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.servicios.items]
  - id: horario
    titulo: "Horario"
    pregunta: "¿Qué días y a qué horas abres?"
    ayuda: "Por ejemplo: de lunes a sábado, de 9 a 14 h."
    tipo: lista
    campos: [secciones.horario-ubicacion.horario]
  - id: ubicacion
    titulo: "Dónde estás"
    pregunta: "¿Cómo se llega a tu local? Calle, referencias, aparcamiento…"
    tipo: texto
    campos: [secciones.horario-ubicacion.titulo, secciones.horario-ubicacion.texto]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.galeria.galeria, secciones.horario-ubicacion.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
